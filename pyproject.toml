[project]
name = "aqua-whisper"
version = "0.1.0"
description = "FastAPI + Celery + Redis async YouTube transcript pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "celery[redis]",
    "redis",
    "httpx",
    "pydantic-settings",
    "faster-whisper",
    "yt-dlp",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "yt-dlp-ejs>=0.8.0",
    "openai>=3.22.1",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".cursor"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]

# celery and faster-whisper do not ship py.typed markers; treat their imports as Any.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

# Celery's untyped @task decorator would otherwise mark every task function untyped.
[[tool.mypy.overrides]]
module = "app.tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
