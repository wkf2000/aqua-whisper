# aqua-whisper: API + Celery worker from a single image.
#
# One file for both local development and production; the mode is chosen by
# environment variables (Compose automatically reads a `.env` file next to
# this file for variable substitution).
#
#   Local (defaults):
#     - Image builds locally from the Dockerfile as `aqua-whisper:latest`
#       (`docker compose up --build`).
#     - API published on host port 8000.
#     - Services attach to the external `aqua-whisper-backend` network
#       (create it once: `docker network create aqua-whisper-backend`).
#     - `./whisper-model` is bind-mounted at `/whisper-model`.
#     - `./data` is bind-mounted at `/data`; the worker saves generated
#       transcripts to SQLite at /data/transcripts.db (override the host
#       dir with AQUA_WHISPER_DATA_DIR).
#
#   Production:
#     - Set the AQUA_WHISPER_* variables (see .env.example) to pull the
#       CI-built image from GHCR, change the host port, attach to an existing
#       external network (e.g. 1panel-network), and bind a local Whisper
#       model directory.
#
# Redis is external — not included in this Compose file. Set REDIS_URL (e.g.
# redis://host.docker.internal:6379/0 for local Docker) in `.env` or the
# environment. The API service also requires API_KEY.

services:
  api:
    image: ${AQUA_WHISPER_IMAGE:-aqua-whisper:latest}
    build: .
    container_name: aqua-whisper-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - backend
    ports:
      - "${AQUA_WHISPER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      TRANSCRIPT_DB_PATH: /data/transcripts.db
    volumes:
      - ${AQUA_WHISPER_MODEL_DIR:-./whisper-model}:/whisper-model
      - ${AQUA_WHISPER_DATA_DIR:-./data}:/data

  worker:
    image: ${AQUA_WHISPER_IMAGE:-aqua-whisper:latest}
    build: .
    container_name: aqua-whisper-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      TRANSCRIPT_DB_PATH: /data/transcripts.db
    networks:
      - backend
    volumes:
      - ${AQUA_WHISPER_MODEL_DIR:-./whisper-model}:/whisper-model
      - ${AQUA_WHISPER_DATA_DIR:-./data}:/data

networks:
  backend:
    name: ${AQUA_WHISPER_NETWORK:-aqua-whisper-backend}
    external: true
